name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'WebApp'
      package_id:
        description: 'Package ID'
        required: true
        default: 'com.bot.webapp'
      orientation:
        description: 'Orientasi Layar'
        required: false
        default: 'unspecified'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set App Name, Package ID, Orientation, Icons & WebView
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_ID: ${{ github.event.inputs.package_id }}
          ORIENTATION: ${{ github.event.inputs.orientation }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 -c '
          import os, re, shutil, glob
          from PIL import Image

          raw_name = os.environ.get("APP_NAME", "WebApp")
          name = re.sub(r"[^a-zA-Z0-9 _-]", "", raw_name).strip() or "WebApp"
          pkg = re.sub(r"[^a-zA-Z0-9._]", "", os.environ.get("PACKAGE_ID", "com.bot.webapp")).strip() or "com.bot.webapp"
          orient = os.environ.get("ORIENTATION", "unspecified").strip().lower()
          if orient not in ("portrait", "landscape", "unspecified"):
              orient = "unspecified"

          # 1. Tulis ulang values/strings.xml
          shutil.rmtree("app/src/main/res/values", ignore_errors=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          with open("app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write(f"<resources>\n    <string name=\"app_name\">{name}</string>\n</resources>\n")

          # 2. Perbarui applicationId di app/build.gradle
          with open("app/build.gradle", "r", encoding="utf-8") as f:
              gradle_txt = f.read()
          gradle_txt = re.sub(r"applicationId\s+[\"\x27][^\"\x27]*[\"\x27]", f"applicationId \"{pkg}\"", gradle_txt)
          with open("app/build.gradle", "w", encoding="utf-8") as f:
              f.write(gradle_txt)

          # 3. Paksa AndroidManifest.xml memakai @string/app_name, @mipmap/ic_launcher & orientasi
          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  manifest = f.read()
              manifest = re.sub(r"android:label=[\"\x27][^\"\x27]*[\"\x27]", "android:label=\"@string/app_name\"", manifest)
              manifest = re.sub(r"android:icon=[\"\x27][^\"\x27]*[\"\x27]", "android:icon=\"@mipmap/ic_launcher\"", manifest)
              manifest = re.sub(r"android:roundIcon=[\"\x27][^\"\x27]*[\"\x27]", "android:roundIcon=\"@mipmap/ic_launcher_round\"", manifest)
              if "android:screenOrientation=" in manifest:
                  manifest = re.sub(r"android:screenOrientation=[\"\x27][^\"\x27]*[\"\x27]", f"android:screenOrientation=\"{orient}\"", manifest)
              elif orient != "unspecified":
                  manifest = re.sub(r"(<activity\b)", f"\\1 android:screenOrientation=\"{orient}\"", manifest, count=1)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(manifest)

          # 4. Hapus semua folder mipmap lama (termasuk adaptive icon) dan generate ulang semua ukuran
          for old_dir in glob.glob("app/src/main/res/mipmap*"):
              shutil.rmtree(old_dir, ignore_errors=True)

          if os.path.exists("icon.png"):
              base_img = Image.open("icon.png").convert("RGBA")
              w, h = base_img.size
              m = min(w, h)
              base_img = base_img.crop(((w - m) // 2, (h - m) // 2, (w + m) // 2, (h + m) // 2))
          else:
              base_img = Image.new("RGBA", (512, 512), (33, 150, 243, 255))

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in densities.items():
              out_dir = os.path.join("app/src/main/res", folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = base_img.resize((size, size), Image.LANCZOS)
              resized.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
              resized.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")

          # 5. Pastikan semua MainActivity.java di src/main mengaktifkan WebView penuh
          for ma_path in glob.glob("app/src/main/java/**/MainActivity.java", recursive=True):
              pkg_match = re.search(r"app/src/main/java/(.+)/MainActivity\.java$", ma_path.replace("\\", "/"))
              java_pkg = pkg_match.group(1).replace("/", ".") if pkg_match else "com.bot.webtoapk"
              with open(ma_path, "w", encoding="utf-8") as mf:
                  mf.write(f"""package {java_pkg};

import android.app.Activity;
import android.app.AlertDialog;
import android.content.Intent;
import android.graphics.Color;
import android.net.Uri;
import android.os.Bundle;
import android.view.ViewGroup;
import android.view.Window;
import android.webkit.JsPromptResult;
import android.webkit.JsResult;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceRequest;
import android.webkit.WebResourceResponse;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.widget.EditText;
import java.io.InputStream;
import java.util.HashMap;
import java.util.Map;

public class MainActivity extends Activity {{
    private static final String VIRTUAL_HOST = "appassets.androidplatform.net";
    private static final int FILE_CHOOSER_REQ = 1001;
    private WebView webView;
    private ValueCallback<Uri[]> fileCallback;

    @Override
    protected void onCreate(Bundle savedInstanceState) {{
        super.onCreate(savedInstanceState);
        requestWindowFeature(Window.FEATURE_NO_TITLE);
        webView = new WebView(this);
        webView.setBackgroundColor(Color.parseColor("#0b1024"));
        webView.setFocusable(true);
        webView.setFocusableInTouchMode(true);

        WebSettings s = webView.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setDatabaseEnabled(true);
        s.setAllowFileAccess(true);
        s.setAllowContentAccess(true);
        s.setJavaScriptCanOpenWindowsAutomatically(true);
        s.setLoadWithOverviewMode(true);
        s.setUseWideViewPort(true);
        s.setMediaPlaybackRequiresUserGesture(false);
        s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

        webView.setWebViewClient(new WebViewClient() {{
            @Override
            public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req) {{
                Uri u = req.getUrl();
                if (u != null && VIRTUAL_HOST.equalsIgnoreCase(u.getHost())) {{
                    String p = u.getPath();
                    if (p == null || p.equals("/") || p.isEmpty()) p = "/assets/index.html";
                    if (p.startsWith("/assets/")) {{
                        String ap = p.substring("/assets/".length());
                        try {{
                            InputStream is = getAssets().open(ap);
                            Map<String, String> h = new HashMap<>();
                            h.put("Access-Control-Allow-Origin", "*");
                            return new WebResourceResponse(ap.endsWith(".js") ? "application/javascript" : ap.endsWith(".css") ? "text/css" : "text/html", "UTF-8", 200, "OK", h, is);
                        }} catch (Exception ignored) {{}}
                    }}
                }}
                return super.shouldInterceptRequest(view, req);
            }}
        }});

        webView.setWebChromeClient(new WebChromeClient() {{
            @Override
            public boolean onJsAlert(WebView v, String u, String m, JsResult r) {{
                new AlertDialog.Builder(MainActivity.this).setMessage(m).setPositiveButton("OK", (d, w) -> r.confirm()).setOnCancelListener(d -> r.cancel()).show();
                return true;
            }}
            @Override
            public boolean onJsConfirm(WebView v, String u, String m, JsResult r) {{
                new AlertDialog.Builder(MainActivity.this).setMessage(m).setPositiveButton("Ya", (d, w) -> r.confirm()).setNegativeButton("Batal", (d, w) -> r.cancel()).setOnCancelListener(d -> r.cancel()).show();
                return true;
            }}
            @Override
            public boolean onJsPrompt(WebView v, String u, String m, String def, JsPromptResult r) {{
                final EditText in = new EditText(MainActivity.this);
                in.setText(def);
                new AlertDialog.Builder(MainActivity.this).setMessage(m).setView(in).setPositiveButton("OK", (d, w) -> r.confirm(in.getText().toString())).setNegativeButton("Batal", (d, w) -> r.cancel()).setOnCancelListener(d -> r.cancel()).show();
                return true;
            }}
            @Override
            public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {{
                if (fileCallback != null) fileCallback.onReceiveValue(null);
                fileCallback = cb;
                try {{ startActivityForResult(p.createIntent(), FILE_CHOOSER_REQ); return true; }}
                catch (Exception e) {{ fileCallback = null; return false; }}
            }}
        }});

        setContentView(webView, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
        webView.requestFocus();
        webView.loadUrl("https://" + VIRTUAL_HOST + "/assets/index.html");
    }}

    @Override
    protected void onActivityResult(int req, int res, Intent data) {{
        if (req == FILE_CHOOSER_REQ && fileCallback != null) {{
            fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
            fileCallback = null;
            return;
        }}
        super.onActivityResult(req, res, data);
    }}

    @Override
    public void onBackPressed() {{
        if (webView != null && webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }}
}}
""")
          '

      - name: Compile APK
        run: gradle assembleRelease

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d$ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          keytool -genkeypair -v -keystore release.keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Bot, OU=Dev, O=App, L=ID, S=ID, C=ID"
          $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out final-app.apk app-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: final-app.apk
