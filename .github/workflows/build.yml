name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'WebApp'
      package_id:
        description: 'Package ID'
        required: true
        default: 'com.bot.webapp'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set App Name & Package ID
        run: |
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | sed 's/[&/\]/\\&/g')
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$SAFE_NAME</string>|g" app/src/main/res/values/strings.xml
          sed -i "s|applicationId \".*\"|applicationId \"${{ github.event.inputs.package_id }}\"|g" app/build.gradle

      - name: Compile APK
        run: gradle assembleRelease

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          keytool -genkeypair -v -keystore release.keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Bot, OU=Dev, O=App, L=ID, S=ID, C=ID"
          $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out final-app.apk app-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: final-app.apk
          
