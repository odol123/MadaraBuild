name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'WebApp'
      package_id:
        description: 'Package ID'
        required: true
        default: 'com.bot.webapp'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set App Name, Package ID & Icon
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_ID: ${{ github.event.inputs.package_id }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 -c '
          import os, re, shutil
          from PIL import Image

          raw_name = os.environ.get("APP_NAME", "WebApp")
          name = re.sub(r"[^a-zA-Z0-9 _-]", "", raw_name).strip() or "WebApp"
          pkg = re.sub(r"[^a-zA-Z0-9._]", "", os.environ.get("PACKAGE_ID", "com.bot.webapp")).strip() or "com.bot.webapp"

          shutil.rmtree("app/src/main/res/values", ignore_errors=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          with open("app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write(f"<resources>\n    <string name=\"app_name\">{name}</string>\n</resources>\n")

          with open("app/build.gradle", "r", encoding="utf-8") as f:
              gradle_txt = f.read()
          gradle_txt = re.sub(r"applicationId\s+\"[^\"]*\"", f"applicationId \"{pkg}\"", gradle_txt)
          with open("app/build.gradle", "w", encoding="utf-8") as f:
              f.write(gradle_txt)

          os.makedirs("app/src/main/res/mipmap-xxxhdpi", exist_ok=True)
          out_icon = "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          if os.path.exists("icon.png"):
              img = Image.open("icon.png").convert("RGBA")
              w, h = img.size
              m = min(w, h)
              img = img.crop(((w - m) // 2, (h - m) // 2, (w + m) // 2, (h + m) // 2))
              img = img.resize((192, 192), Image.LANCZOS)
              img.save(out_icon, "PNG")
          else:
              Image.new("RGBA", (192, 192), (33, 150, 243, 255)).save(out_icon, "PNG")
          '

      - name: Compile APK
        run: gradle assembleRelease

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          keytool -genkeypair -v -keystore release.keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Bot, OU=Dev, O=App, L=ID, S=ID, C=ID"
          $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out final-app.apk app-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: final-app.apk
          
