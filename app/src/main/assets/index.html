<!DOCTYPE html>
<html lang="id" data-theme="dark" data-font="auto" data-bg="none">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rubik Timer — timer speedcubing: inspeksi WCA, scramble 3x3/2x2, statistik best/ao5/ao12, 7 tema, latar foto dengan efek kaca buram, mode timer penuh, font, peringatan rekor baru.">
<meta name="theme-color" content="#08090c">
<title>Rubik Timer — Speedcubing Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101218'/%3E%3Crect x='6' y='6' width='8' height='8' rx='2' fill='%234dd4ff'/%3E%3Crect x='18' y='6' width='8' height='8' rx='2' fill='%2334e08a'/%3E%3Crect x='6' y='18' width='8' height='8' rx='2' fill='%23ffcc4d'/%3E%3Crect x='18' y='18' width='8' height='8' rx='2' fill='%23ff5c7a'/%3E%3C/svg%3E">
<style>
  :root{
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --rounded: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Segoe UI", system-ui, sans-serif;
    --condensed: "Arial Narrow", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
    --ease: .35s ease;
    --veil: .62;
    --photo: none;
    --font: var(--sans);
    --glass-blur: 16px;
    --ctl: 38px;
  }

  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#08090c; --card:#11151d; --fg:#e8ecf4; --dim:#8b94a7; --line:#1e2431;
    --accent:#4dd4ff; --ready:#34e08a; --warn:#ffcc4d; --bad:#ff5c7a; --radius:14px; --veil:.62;
  }
  html[data-theme="light"]{
    color-scheme: light;
    --bg:#f4f6fb; --card:#fff; --fg:#10131a; --dim:#5c6577; --line:#dbe1ec;
    --accent:#0b8fd6; --ready:#12a05f; --warn:#c98a00; --bad:#d93a5c; --radius:14px; --veil:.55;
  }
  html[data-theme="midnight"]{
    color-scheme: dark;
    --bg:#0a0f1e; --card:#121a30; --fg:#dbe4ff; --dim:#7c89a8; --line:#1e2942;
    --accent:#7c9cff; --ready:#4de0a0; --warn:#ffd166; --bad:#ff6b8b; --radius:18px; --veil:.6;
  }
  html[data-theme="nord"]{
    color-scheme: dark;
    --bg:#0e1620; --card:#16222f; --fg:#e5eef7; --dim:#8296a8; --line:#22303f;
    --accent:#88c0d0; --ready:#a3be8c; --warn:#ebcb8b; --bad:#bf616a; --radius:12px; --veil:.6;
  }
  html[data-theme="forest"]{
    color-scheme: dark;
    --bg:#07130d; --card:#0f2118; --fg:#dff3e6; --dim:#7ba28c; --line:#183326;
    --accent:#4ade80; --ready:#22d3ee; --warn:#fbbf24; --bad:#f87171; --radius:16px; --veil:.6;
  }
  html[data-theme="sunset"]{
    color-scheme: dark;
    --bg:#180d12; --card:#25141c; --fg:#ffe9ef; --dim:#b08794; --line:#3a1f2b;
    --accent:#ff8fab; --ready:#7ee0c0; --warn:#ffc36b; --bad:#ff5c7a; --radius:18px; --veil:.6;
  }
  html[data-theme="mono"]{
    color-scheme: dark;
    --bg:#0b0b0b; --card:#151515; --fg:#f2f2f2; --dim:#8d8d8d; --line:#262626;
    --accent:#f2f2f2; --ready:#b8ff3d; --warn:#ffd400; --bad:#ff4d4d; --radius:4px; --veil:.7;
  }

  html[data-font="auto"]     { --font: var(--sans); }
  html[data-font="mono"]     { --font: var(--mono); }
  html[data-font="serif"]    { --font: var(--serif); }
  html[data-font="rounded"]  { --font: var(--rounded); }
  html[data-font="condensed"]{ --font: var(--condensed); }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:var(--font); color:var(--fg); background:var(--bg);
    -webkit-tap-highlight-color:transparent; overflow-x:hidden;
    transition:background var(--ease), color var(--ease);
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-2;
    background-image:var(--photo); background-size:cover; background-position:center;
    opacity:0; transition:opacity var(--ease);
  }
  html[data-bg="photo"] body::before{ opacity:1; }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(60% 45% at 50% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%);
    opacity:.9; transition:opacity var(--ease);
  }
  html[data-bg="none"] body::after{ opacity:0; }
  html[data-bg="grid"] body::after{
    background-image:
      linear-gradient(color-mix(in srgb, var(--line) 70%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--line) 70%, transparent) 1px, transparent 1px);
    background-size:44px 44px; opacity:.5;
  }
  html[data-bg="photo"] body::after{
    background:rgba(0,0,0,var(--veil)); opacity:1;
  }

  .wrap{ max-width:820px; margin:0 auto; padding:14px 16px 40px; }

  /* ===== HEADER: boleh wrap, semua kontrol tinggi seragam ===== */
  .top{
    display:flex; align-items:center; gap:10px 12px; flex-wrap:wrap;
    padding:6px 0 14px;
  }
  .brand{
    display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:.4px;
    font-size:14px; white-space:nowrap; flex:1 1 auto; min-width:0;
  }
  .cube{ display:grid; grid-template-columns:1fr 1fr; gap:2px; width:22px; height:22px; flex:0 0 auto; }
  .cube i{ border-radius:3px; display:block; }
  .cube i:nth-child(1){ background:var(--accent); }
  .cube i:nth-child(2){ background:var(--ready); }
  .cube i:nth-child(3){ background:var(--warn); }
  .cube i:nth-child(4){ background:var(--bad); }

  .tools{
    display:flex; gap:8px; align-items:center; flex-wrap:nowrap;
    flex:0 0 auto; margin-left:auto;
  }

  select, button{ font-family:inherit; color:var(--fg); }

  .sel{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    height:var(--ctl); padding:0 10px; font-size:13px; font-weight:600;
    outline:none; color:var(--fg); width:auto; min-width:0; flex:0 0 auto;
    -webkit-appearance:menulist; appearance:auto;
  }
  .sel option{ background:var(--card); color:var(--fg); }
  .sel:focus-visible{ border-color:var(--accent); }

  /* tombol ikon: SVG inline -> selalu render, tidak bergantung font emoji */
  .icon{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    height:var(--ctl); min-width:var(--ctl); padding:0 10px;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    cursor:pointer; color:var(--fg); font-size:13px; font-weight:600; line-height:1;
    flex:0 0 auto; white-space:nowrap;
    transition:transform .15s, border-color .2s, color .2s;
  }
  .icon svg{ width:18px; height:18px; display:block; flex:0 0 auto; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .icon .lbl{ display:none; white-space:nowrap; }
  .icon:hover{ border-color:var(--accent); color:var(--accent); }
  .icon:active{ transform:scale(.94); }
  .icon[aria-pressed="true"]{ border-color:var(--accent); color:var(--accent); }

  /* label muncul hanya bila ruang cukup */
  @media (min-width:700px){
    .icon .lbl{ display:inline; }
  }

  /* layar sempit: brand 1 baris, kontrol turun 1 baris penuh & melebar */
  @media (max-width:520px){
    .brand{ flex:1 1 100%; }
    .tools{ flex:1 1 100%; margin-left:0; }
    .tools .sel{ flex:1 1 auto; width:100%; min-width:0; }
    .tools .icon{ padding:0; min-width:var(--ctl); }
  }

  .scr{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; font-family:var(--mono); font-size:16px; line-height:1.65;
    letter-spacing:.4px; word-spacing:2px; min-height:58px; display:flex; align-items:center;
    transition:border-color var(--ease), background var(--ease);
  }
  .scr.done{ color:var(--dim); }

  .stage{
    margin-top:16px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--card); padding:34px 16px 28px; text-align:center; cursor:pointer;
    transition:border-color .2s, box-shadow .35s, background var(--ease);
    position:relative; overflow:hidden; user-select:none;
  }
  .stage.ready{ border-color:var(--ready); box-shadow:0 0 0 2px color-mix(in srgb, var(--ready) 35%, transparent), 0 0 40px -8px var(--ready); }
  .stage.running{ border-color:var(--accent); }
  .stage.flash{ animation:recFlash 1.1s ease; }
  @keyframes recFlash{
    0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--warn) 70%, transparent), 0 0 0 0 var(--warn); }
    35%{ box-shadow:0 0 0 6px color-mix(in srgb, var(--warn) 45%, transparent), 0 0 60px -4px var(--warn); }
    100%{ box-shadow:0 0 0 0 transparent, 0 0 0 0 transparent; }
  }
  .time{
    font-family:var(--mono); font-variant-numeric:tabular-nums;
    font-size:clamp(46px, 15vw, 92px); font-weight:700; line-height:1;
    letter-spacing:-1px; transition:color .25s;
  }
  .stage.ready .time{ color:var(--ready); }
  .stage.running .time{ color:var(--accent); }
  .stage.inspect .time{ color:var(--warn); }
  .stage.inspect.danger .time{ color:var(--bad); }
  .hint{ margin-top:12px; font-size:12px; color:var(--dim); letter-spacing:.5px; min-height:16px; }

  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 10px; text-align:center; transition:border-color .3s, box-shadow .3s, background var(--ease);
  }
  .card.hit{ border-color:var(--warn); box-shadow:0 0 24px -6px var(--warn); }
  .card b{ display:block; font-family:var(--mono); font-size:18px; font-variant-numeric:tabular-nums; margin-top:4px; }
  .card span{ font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); }

  .listwrap{ margin-top:18px; }
  .listhead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .listhead h2{ font-size:12px; letter-spacing:1.4px; text-transform:uppercase; color:var(--dim); margin:0; font-weight:600; }
  .link{ background:none; border:none; font-size:12px; color:var(--dim); cursor:pointer; padding:4px 6px; border-radius:6px; }
  .link:hover{ color:var(--bad); }

  ol.solves{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  ol.solves li{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:9px 12px; font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums;
  }
  ol.solves li .idx{ color:var(--dim); font-size:11px; min-width:28px; }
  ol.solves li .v{ flex:1; }
  ol.solves li .tag{ font-size:10px; letter-spacing:.8px; color:var(--warn); text-transform:uppercase; }
  ol.solves li.pb{ border-color:color-mix(in srgb, var(--warn) 55%, var(--line)); }
  .empty{ color:var(--dim); font-size:13px; text-align:center; padding:18px; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%, 140%);
    background:var(--card); border:1px solid var(--warn); color:var(--fg);
    padding:13px 18px; border-radius:12px; font-size:13.5px; font-weight:600;
    box-shadow:0 14px 40px -10px rgba(0,0,0,.7), 0 0 30px -10px var(--warn);
    max-width:min(92vw, 420px); text-align:center; z-index:60;
    transition:transform .38s cubic-bezier(.2,.9,.2,1), opacity .3s; opacity:0;
    pointer-events:none;
  }
  .toast.show{ transform:translate(-50%,0); opacity:1; }
  .toast .ttl{ color:var(--warn); letter-spacing:.6px; }
  .toast small{ display:block; margin-top:4px; font-weight:500; color:var(--dim); font-family:var(--mono); font-size:11.5px; }

  .sheet{
    position:fixed; inset:0; z-index:70; display:none;
    background:rgba(0,0,0,.55); backdrop-filter:blur(4px);
  }
  .sheet.open{ display:block; }
  .panel{
    position:absolute; right:0; top:0; bottom:0; width:min(360px, 88vw);
    background:var(--card); border-left:1px solid var(--line);
    padding:18px 18px 30px; overflow-y:auto;
    animation:slideIn .28s ease;
  }
  @keyframes slideIn{ from{ transform:translateX(20px); opacity:0; } }
  .panel h3{ margin:0 0 16px; font-size:13px; letter-spacing:1.4px; text-transform:uppercase; color:var(--dim); }
  .row{ margin-bottom:14px; }
  .row label{ display:block; font-size:12px; color:var(--dim); margin-bottom:6px; letter-spacing:.5px; }
  .row .sel, .row input[type="file"]{ width:100%; }
  .row input[type="file"]{ font-size:12px; color:var(--dim); }
  .switch{ display:flex; justify-content:space-between; align-items:center; }
  .switch input{ width:18px; height:18px; accent-color:var(--accent); }
  .btn{
    width:100%; padding:11px; border-radius:10px; border:1px solid var(--line);
    background:transparent; font-weight:600; font-size:13px; cursor:pointer;
    transition:border-color .2s, color .2s;
  }
  .btn:hover{ border-color:var(--accent); color:var(--accent); }
  .btn.danger:hover{ border-color:var(--bad); color:var(--bad); }
  .sep{ height:1px; background:var(--line); margin:18px 0; }
  .close{ position:absolute; top:14px; right:14px; }

  /* ===== Efek kaca buram (aktif hanya saat latar foto) ===== */
  html[data-bg="photo"] .scr,
  html[data-bg="photo"] .stage,
  html[data-bg="photo"] .card,
  html[data-bg="photo"] ol.solves li,
  html[data-bg="photo"] .sel,
  html[data-bg="photo"] .icon,
  html[data-bg="photo"] .toast,
  html[data-bg="photo"] .panel{
    background:color-mix(in srgb, var(--card) 52%, transparent);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(150%);
    backdrop-filter:blur(var(--glass-blur)) saturate(150%);
    border-color:color-mix(in srgb, var(--fg) 16%, transparent);
    box-shadow:inset 0 1px 0 color-mix(in srgb, var(--fg) 9%, transparent);
  }
  html[data-bg="photo"] .toast{
    box-shadow:0 14px 40px -10px rgba(0,0,0,.7), 0 0 30px -10px var(--warn),
               inset 0 1px 0 color-mix(in srgb, var(--fg) 9%, transparent);
  }
  html[data-bg="photo"] ol.solves li.empty{
    background:transparent; border-color:transparent;
    -webkit-backdrop-filter:none; backdrop-filter:none; box-shadow:none;
  }
  html[data-bg="photo"] .panel{ background:color-mix(in srgb, var(--card) 72%, transparent); }

  /* ===== Mode timer penuh (zen) ===== */
  html.zen, html.zen body{ overflow:hidden; }
  html.zen .wrap{ max-width:none; padding:0; }
  html.zen .top, html.zen .scr, html.zen .stats, html.zen .listwrap{ display:none; }
  html.zen .stage{
    position:fixed; inset:0; margin:0; padding:0; border:0; border-radius:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:transparent; box-shadow:none; z-index:50; max-width:none;
    -webkit-backdrop-filter:none; backdrop-filter:none;
  }
  html.zen .time{ font-size:clamp(52px, 17vw, 220px); letter-spacing:-3px; }
  html.zen .hint{ margin-top:18px; font-size:13px; }
  #zenExit{ display:none; position:fixed; top:14px; right:14px; z-index:80; }
  html.zen #zenExit{ display:inline-flex; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="cube"><i></i><i></i><i></i><i></i></span>
      RUBIK TIMER
    </div>
    <div class="tools">
      <select class="sel" id="puzzle" aria-label="Puzzle">
        <option value="3x3">3x3</option>
        <option value="2x2">2x2</option>
      </select>
      <button class="icon" id="btnZen" title="Timer penuh layar" aria-label="Perbesar timer hingga penuh layar" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5"/><path d="M20 15v5h-5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/></svg>
        <span class="lbl">Penuh</span>
      </button>
      <button class="icon" id="btnNew" title="Scramble baru" aria-label="Scramble baru">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.9-6.4"/><path d="M21 4v6h-6"/></svg>
        <span class="lbl">Acak</span>
      </button>
      <button class="icon" id="btnSettings" title="Pengaturan" aria-label="Pengaturan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg>
        <span class="lbl">Atur</span>
      </button>
    </div>
  </header>

  <div class="scr" id="scr">—</div>

  <section class="stage" id="stage" tabindex="0" aria-live="polite">
    <div class="time" id="time">0.00</div>
    <div class="hint" id="hint">tahan spasi / tap untuk mulai</div>
  </section>

  <div class="stats">
    <div class="card" id="cardBest"><span>Best</span><b id="statBest">—</b></div>
    <div class="card" id="cardAo5"><span>ao5</span><b id="statAo5">—</b></div>
    <div class="card" id="cardAo12"><span>ao12</span><b id="statAo12">—</b></div>
  </div>

  <div class="listwrap">
    <div class="listhead">
      <h2>Riwayat</h2>
      <button class="link" id="btnDelLast">hapus terakhir</button>
    </div>
    <ol class="solves" id="list"></ol>
  </div>
</div>

<button class="icon" id="zenExit" title="Keluar mode timer penuh" aria-label="Keluar mode timer penuh">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
</button>

<div class="toast" id="toast" role="status" aria-live="assertive"></div>

<div class="sheet" id="sheet">
  <div class="panel">
    <button class="icon close" id="btnClose" title="Tutup" aria-label="Tutup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </button>
    <h3>Pengaturan</h3>

    <div class="row">
      <label for="theme">Tema</label>
      <select class="sel" id="theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="midnight">Midnight</option>
        <option value="nord">Nord</option>
        <option value="forest">Forest</option>
        <option value="sunset">Sunset</option>
        <option value="mono">Mono</option>
      </select>
    </div>

    <div class="row">
      <label for="font">Font</label>
      <select class="sel" id="font">
        <option value="auto">Auto (sans)</option>
        <option value="mono">Mono</option>
        <option value="serif">Serif</option>
        <option value="rounded">Rounded</option>
        <option value="condensed">Condensed</option>
      </select>
    </div>

    <div class="row">
      <label for="bg">Latar</label>
      <select class="sel" id="bg">
        <option value="none">Polos</option>
        <option value="grid">Grid</option>
        <option value="photo">Foto (kaca buram)</option>
      </select>
    </div>

    <div class="row" id="rowPhoto" style="display:none">
      <label for="photo">Foto latar</label>
      <input type="file" id="photo" accept="image/*">
      <button class="btn" id="btnClearPhoto" style="margin-top:8px">Hapus foto</button>
    </div>

    <div class="row switch">
      <label for="ins" style="margin:0">Inspeksi 15 detik</label>
      <input type="checkbox" id="ins">
    </div>

    <div class="sep"></div>

    <div class="row">
      <button class="btn danger" id="btnReset">Reset semua rekor</button>
    </div>
    <div class="row">
      <button class="btn" id="btnFull">Layar penuh</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = (s) => document.querySelector(s);
  const KEY = "rubiktimer.v1";
  const MAX_SOLVES = 500;          // ponytail: simpan 500 solve terakhir; PB disimpan terpisah jadi tidak hilang
  const HOLD_MS = 300;             // tahan sebelum siap
  const INSPECT_MS = 15000;

  const el = {
    scr: $("#scr"), stage: $("#stage"), time: $("#time"), hint: $("#hint"),
    list: $("#list"), toast: $("#toast"), sheet: $("#sheet"),
    statBest: $("#statBest"), statAo5: $("#statAo5"), statAo12: $("#statAo12"),
    cardBest: $("#cardBest"), cardAo5: $("#cardAo5"), cardAo12: $("#cardAo12"),
    puzzle: $("#puzzle"), theme: $("#theme"), font: $("#font"), bg: $("#bg"),
    ins: $("#ins"), photo: $("#photo"), rowPhoto: $("#rowPhoto"),
    btnZen: $("#btnZen"), zenExit: $("#zenExit")
  };

  const DEFAULTS = {
    theme: "dark", font: "auto", bg: "none", ins: false, puzzle: "3x3",
    solves: [], pb: { single: null, ao5: null, ao12: null }, photo: null
  };

  let S = load();
  let phase = "idle";      // idle | inspect | hold | ready | running
  let startAt = 0, rafId = 0, holdTimer = 0, inspectTimer = 0, inspectLeft = 0;

  /* ---------- storage ---------- */
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return structuredClone(DEFAULTS);
      const p = JSON.parse(raw);
      return {
        ...DEFAULTS, ...p,
        pb: { ...DEFAULTS.pb, ...(p.pb || {}) },
        solves: Array.isArray(p.solves) ? p.solves : []
      };
    } catch { return structuredClone(DEFAULTS); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch { toast("Penyimpanan penuh", "riwayat tidak tersimpan"); }
  }

  /* ---------- format & statistik ---------- */
  function fmt(ms) {
    if (ms == null || !isFinite(ms)) return "—";
    const t = Math.max(0, Math.round(ms));
    const m = Math.floor(t / 60000);
    const s = Math.floor((t % 60000) / 1000);
    const c = Math.floor((t % 1000) / 10);
    const ss = String(s).padStart(m ? 2 : 1, "0");
    return m
      ? `${m}:${String(s).padStart(2, "0")}.${String(c).padStart(2, "0")}`
      : `${ss}.${String(c).padStart(2, "0")}`;
  }

  function avg(list, n) {
    if (list.length < n) return null;
    const part = list.slice(0, n);
    const sorted = [...part].sort((a, b) => a - b);
    const trimmed = sorted.slice(1, -1);
    return trimmed.reduce((a, b) => a + b, 0) / trimmed.length;
  }

  /* ---------- scramble ---------- */
  const AXIS = { R: 0, L: 0, U: 1, D: 1, F: 2, B: 2 };
  const SUF = ["", "'", "2"];
  function scramble(n, faces) {
    const out = [];
    let prevAxis = -1, prevFace = "";
    while (out.length < n) {
      const f = faces[(Math.random() * faces.length) | 0];
      if (AXIS[f] === prevAxis || f === prevFace) continue;
      prevAxis = AXIS[f]; prevFace = f;
      out.push(f + SUF[(Math.random() * 3) | 0]);
    }
    return out.join(" ");
  }
  function newScramble() {
    const is2 = S.puzzle === "2x2";
    el.scr.textContent = scramble(is2 ? 11 : 20, is2 ? ["R", "U", "F"] : ["R", "L", "U", "D", "F", "B"]);
    el.scr.classList.remove("done");
  }

  /* ---------- render ---------- */
  function renderStats() {
    el.statBest.textContent = fmt(S.pb.single);
    el.statAo5.textContent = fmt(avg(S.solves, 5));
    el.statAo12.textContent = fmt(avg(S.solves, 12));
  }

  function renderList() {
    const items = S.solves;
    if (!items.length) {
      el.list.innerHTML = '<li class="empty">Belum ada solve. Tekan spasi untuk mulai.</li>';
      return;
    }
    el.list.innerHTML = items.slice(0, 50).map((ms, i) => {
      const n = items.length - i;
      const isPB = ms === S.pb.single;
      const tag = isPB ? '<span class="tag">PB</span>' : "";
      return `<li class="${isPB ? "pb" : ""}">
        <span class="idx">#${n}</span>
        <span class="v">${fmt(ms)}</span>${tag}
      </li>`;
    }).join("");
  }

  function renderAll() {
    document.documentElement.dataset.theme = S.theme;
    document.documentElement.dataset.font = S.font;
    document.documentElement.dataset.bg = S.bg;
    document.documentElement.style.setProperty("--photo", S.photo ? `url("${S.photo}")` : "none");
    el.puzzle.value = S.puzzle;
    el.theme.value = S.theme;
    el.font.value = S.font;
    el.bg.value = S.bg;
    el.ins.checked = !!S.ins;
    el.rowPhoto.style.display = S.bg === "photo" ? "block" : "none";
    renderStats();
    renderList();
  }

  /* ---------- toast & rekor ---------- */
  let toastTimer = 0;
  function toast(title, sub) {
    el.toast.innerHTML = `<span class="ttl">${title}</span>` + (sub ? `<small>${sub}</small>` : "");
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove("show"), 3600);
  }

  function flashCard(card) {
    card.classList.add("hit");
    setTimeout(() => card.classList.remove("hit"), 1600);
  }

  // Bandingkan hasil solve baru ke PB tersimpan. Return daftar rekor yang pecah.
  function checkPB(time) {
    const hits = [];
    const pb = S.pb;

    if (pb.single == null || time < pb.single) {
      hits.push({ kind: "Single", val: time, card: el.cardBest, old: pb.single });
      pb.single = time;
    }
    const a5 = avg(S.solves, 5);
    if (a5 != null && (pb.ao5 == null || a5 < pb.ao5)) {
      hits.push({ kind: "ao5", val: a5, card: el.cardAo5, old: pb.ao5 });
      pb.ao5 = a5;
    }
    const a12 = avg(S.solves, 12);
    if (a12 != null && (pb.ao12 == null || a12 < pb.ao12)) {
      hits.push({ kind: "ao12", val: a12, card: el.cardAo12, old: pb.ao12 });
      pb.ao12 = a12;
    }
    return hits;
  }

  function announce(hits) {
    const first = hits[0];
    const parts = hits.map(h => `${h.kind} ${fmt(h.val)}`);

    el.stage.classList.add("flash");
    setTimeout(() => el.stage.classList.remove("flash"), 1200);
    hits.forEach(h => flashCard(h.card));
    if (navigator.vibrate) { try { navigator.vibrate(hits.length > 1 ? [40, 60, 40] : 55); } catch {} }

    const sub = first.old == null ? "rekor pertama" : `sebelumnya ${fmt(first.old)}`;
    toast(hits.length > 1 ? `REKOR BARU! ${parts.join(" · ")}` : `REKOR BARU! ${first.kind} ${fmt(first.val)}`, sub);
  }

  /* ---------- alur timer ---------- */
  function setPhase(p) {
    phase = p;
    el.stage.classList.toggle("ready", p === "ready");
    el.stage.classList.toggle("running", p === "running");
    el.stage.classList.toggle("inspect", p === "inspect");
    if (p !== "inspect") el.stage.classList.remove("danger");
  }

  function tick() {
    el.time.textContent = fmt(performance.now() - startAt);
    rafId = requestAnimationFrame(tick);
  }

  function startRun() {
    setPhase("running");
    el.hint.textContent = "spasi / tap untuk stop";
    startAt = performance.now();
    el.time.textContent = "0.00";
    rafId = requestAnimationFrame(tick);
  }

  function stopRun() {
    cancelAnimationFrame(rafId);
    const time = performance.now() - startAt;
    el.time.textContent = fmt(time);
    setPhase("idle");
    el.hint.textContent = "tahan spasi / tap untuk mulai";
    el.scr.classList.add("done");

    S.solves.unshift(time);
    if (S.solves.length > MAX_SOLVES) S.solves.length = MAX_SOLVES;

    const hits = checkPB(time);
    save();
    renderStats();
    renderList();
    if (hits.length) announce(hits);
    newScramble();
  }

  function startHold() {
    setPhase("hold");
    el.hint.textContent = "tahan…";
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      if (phase !== "hold") return;
      setPhase("ready");
      el.hint.textContent = "lepas untuk mulai";
    }, HOLD_MS);
  }

  function cancelHold() {
    clearTimeout(holdTimer);
    if (phase === "hold" || phase === "ready") {
      setPhase(S.ins ? "inspect" : "idle");
      el.hint.textContent = S.ins ? "inspeksi berjalan — tahan untuk mulai" : "tahan spasi / tap untuk mulai";
    }
  }

  function startInspect() {
    setPhase("inspect");
    inspectLeft = INSPECT_MS;
    el.time.textContent = "15";
    el.hint.textContent = "inspeksi — tahan untuk mulai";
    clearInterval(inspectTimer);
    inspectTimer = setInterval(() => {
      inspectLeft -= 100;
      const sec = Math.ceil(inspectLeft / 1000);
      el.time.textContent = String(Math.max(0, sec));
      el.stage.classList.toggle("danger", sec <= 3);
      if (inspectLeft <= 0) {
        clearInterval(inspectTimer);
        startRun();
      }
    }, 100);
  }

  function stopInspect() {
    clearInterval(inspectTimer);
    el.stage.classList.remove("danger");
  }

  function primaryDown() {
    if (phase === "idle") {
      if (S.ins) startInspect();
      else startHold();
    } else if (phase === "inspect") {
      stopInspect();
      startHold();
    } else if (phase === "running") {
      stopRun();
    }
  }

  function primaryUp() {
    if (phase === "hold") cancelHold();
    else if (phase === "ready") { setPhase("idle"); startRun(); }
  }

  /* ---------- mode timer penuh ---------- */
  function setZen(on) {
    document.documentElement.classList.toggle("zen", on);
    el.btnZen.setAttribute("aria-pressed", on ? "true" : "false");
    if (on) el.stage.focus({ preventScroll: true });
  }
  function isZen() { return document.documentElement.classList.contains("zen"); }

  async function enterFullscreen() {
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch {}
  }
  async function exitFullscreen() {
    try { if (document.fullscreenElement) await document.exitFullscreen(); } catch {}
  }

  el.btnZen.addEventListener("click", () => {
    const on = !isZen();
    setZen(on);
    if (on) enterFullscreen(); else exitFullscreen();
  });

  el.zenExit.addEventListener("pointerdown", (e) => e.stopPropagation());
  el.zenExit.addEventListener("click", (e) => {
    e.stopPropagation();
    setZen(false);
    exitFullscreen();
  });

  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && isZen()) setZen(false);
  });

  /* ---------- input ---------- */
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && isZen()) { setZen(false); exitFullscreen(); return; }
    if (e.code !== "Space" && e.key !== " ") return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || tag === "button") return;
    e.preventDefault();
    if (e.repeat) return;
    primaryDown();
  });
  window.addEventListener("keyup", (e) => {
    if (e.code !== "Space" && e.key !== " ") return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || tag === "button") return;
    e.preventDefault();
    primaryUp();
  });

  el.stage.addEventListener("pointerdown", (e) => { e.preventDefault(); primaryDown(); });
  el.stage.addEventListener("pointerup", (e) => { e.preventDefault(); primaryUp(); });
  el.stage.addEventListener("pointercancel", () => cancelHold());
  el.stage.addEventListener("contextmenu", (e) => e.preventDefault());

  /* ---------- toolbar & settings ---------- */
  $("#btnNew").addEventListener("click", () => { if (phase === "idle") newScramble(); });

  el.puzzle.addEventListener("change", () => {
    S.puzzle = el.puzzle.value;
    save(); newScramble(); renderStats();
  });

  $("#btnSettings").addEventListener("click", () => el.sheet.classList.add("open"));
  $("#btnClose").addEventListener("click", () => el.sheet.classList.remove("open"));
  el.sheet.addEventListener("click", (e) => { if (e.target === el.sheet) el.sheet.classList.remove("open"); });

  el.theme.addEventListener("change", () => { S.theme = el.theme.value; save(); renderAll(); });
  el.font.addEventListener("change", () => { S.font = el.font.value; save(); renderAll(); });
  el.bg.addEventListener("change", () => { S.bg = el.bg.value; save(); renderAll(); });
  el.ins.addEventListener("change", () => { S.ins = el.ins.checked; save(); });

  el.photo.addEventListener("change", async () => {
    const file = el.photo.files && el.photo.files[0];
    if (!file) return;
    try {
      S.photo = await shrink(file);
      S.bg = "photo";
      save(); renderAll();
      toast("Latar foto dipasang", "kaca buram aktif");
    } catch { toast("Gagal memuat foto", "coba gambar lain"); }
  });

  $("#btnClearPhoto").addEventListener("click", () => {
    S.photo = null; S.bg = "none"; el.photo.value = ""; save(); renderAll();
  });

  // ponytail: resize ke maks 1600px sisi terpanjang, JPEG q0.82 — cukup untuk wallpaper, aman dari kuota localStorage
  function shrink(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
      img.src = url;
    });
  }

  $("#btnDelLast").addEventListener("click", () => {
    if (!S.solves.length) return;
    S.solves.shift();
    save(); renderStats(); renderList();
    toast("Solve terakhir dihapus", "");
  });

  $("#btnReset").addEventListener("click", () => {
    if (!confirm("Hapus semua solve dan rekor? Tindakan ini tidak bisa dibatalkan.")) return;
    S.solves = [];
    S.pb = { single: null, ao5: null, ao12: null };
    save(); renderStats(); renderList();
    toast("Semua data direset", "");
  });

  $("#btnFull").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch { toast("Layar penuh tidak didukung", ""); }
  });

  /* ---------- init ---------- */
  renderAll();
  newScramble();
  el.stage.focus({ preventScroll: true });
})();
</script>
</body>
</html>
