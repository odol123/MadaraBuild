<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1024">
<title>AetherCube Timer — WCA Speedcube Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(255,255,255,.07);
  --glass-hi:rgba(255,255,255,.13);
  --border:rgba(255,255,255,.16);
  --shine:rgba(255,255,255,.22);
  --text:#fff;
  --muted:rgba(255,255,255,.62);
  --accent:#6366f1;
  --accent-2:#a855f7;
  --danger:#ef4444;
  --grad:linear-gradient(150deg,#0b1024 0%,#1b1740 55%,#2a0f3d 100%);
  --blur:16px;
  --bgimg:none;
  --overlay:.38;
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  color:var(--text);background:var(--grad);min-height:100dvh;
  display:flex;flex-direction:column;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
body::before{
  content:'';position:fixed;inset:-40px;z-index:-3;pointer-events:none;
  background-image:var(--bgimg);background-size:cover;background-position:center;
  filter:blur(var(--blur));transform:translateZ(0);transition:filter .25s,opacity .25s;
}
body::after{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:var(--grad);opacity:var(--overlay);transition:opacity .25s;
}
.glass-panel{
  background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.022));
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 10px 28px rgba(0,0,0,.30),inset 0 1px 0 var(--shine);
}
header{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:.7rem 1.1rem;border-bottom:1px solid var(--border);
  background:rgba(10,12,30,.42);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.02rem;letter-spacing:-.4px}
.logo-icon{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 4px 14px rgba(99,102,241,.45);
}
.nav-controls{display:flex;gap:8px}
.btn{
  background:var(--glass);border:1px solid var(--border);color:var(--text);
  padding:9px 14px;border-radius:12px;font-weight:700;font-size:.85rem;
  font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:background .18s,border-color .18s,transform .12s;
}
.btn:hover{background:var(--glass-hi);border-color:rgba(255,255,255,.3)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-icon{padding:9px 11px}
.btn-danger{border-color:rgba(239,68,68,.5);color:#fecaca}
.btn-danger:hover{background:rgba(239,68,68,.18)}
.main-container{
  flex:1;display:grid;grid-template-columns:290px minmax(0,1fr) 320px;
  gap:16px;padding:16px;max-width:1560px;margin:0 auto;width:100%;
}
.sidebar-left,.sidebar-right{display:flex;flex-direction:column;gap:16px;min-width:0}
.center-stage{display:flex;flex-direction:column;gap:12px;min-width:0}
@media(max-width:1180px){
  .main-container{grid-template-columns:minmax(0,1fr) 300px}
  .sidebar-left{display:none}
}
@media(max-width:860px){
  .main-container{grid-template-columns:minmax(0,1fr);padding:10px;gap:12px}
  header{padding:.6rem .8rem}
  .logo span{display:none}
  .nav-controls .btn span{display:none}
  .nav-controls .btn{padding:9px 11px}
  .history-list{max-height:300px}
  .scramble-text{font-size:.92rem}
}
.panel-section{padding:16px}
.section-title{
  font-size:.72rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);
  margin-bottom:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px;
}
select,input[type=text],input[type=file],input[type=range]{
  font-family:inherit;font-size:.9rem;color:var(--text);width:100%;
  background:rgba(0,0,0,.32);border:1px solid var(--border);
  border-radius:11px;padding:10px 12px;outline:none;transition:border-color .18s;
}
select:focus,input:focus{border-color:var(--accent)}
select option{background:#161334;color:#fff}
input[type=range]{padding:0;height:26px;background:none;border:none;accent-color:var(--accent)}
input[type=file]{font-size:.78rem;padding:8px}
input[type=file]::file-selector-button{
  font-family:inherit;font-weight:700;font-size:.78rem;margin-right:10px;cursor:pointer;
  background:var(--glass-hi);color:#fff;border:1px solid var(--border);
  border-radius:9px;padding:7px 11px;
}
.form-group{margin-bottom:14px}
.form-group:last-child{margin-bottom:0}
.form-label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:700}
.form-label b{color:#c7d2fe}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-card{
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:3px;
}
.stat-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.6px}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:1.12rem;font-weight:800}
.scramble-box{
  background:rgba(0,0,0,.28);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;text-align:center;
  display:flex;flex-direction:column;gap:10px;
}
.scramble-text{
  font-family:'JetBrains Mono',monospace;font-size:1.08rem;font-weight:700;
  line-height:1.5;word-spacing:3px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);
  min-height:1.5em;
}
.scramble-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.net-wrap{display:none;padding-top:4px}
.net-wrap.show{display:block}
.net{
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,auto);
  gap:5px;width:min(270px,100%);margin:0 auto;
}
.net-face{display:grid;gap:2px;aspect-ratio:1;background:rgba(0,0,0,.4);padding:2px;border-radius:6px}
.net-face.blank{background:transparent;padding:0}
.net-cell{border-radius:2px;border:1px solid rgba(0,0,0,.45)}
.timer-top-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px}
.session-badge{
  font-size:.78rem;font-weight:800;color:var(--muted);
  background:rgba(255,255,255,.06);padding:6px 12px;border-radius:10px;
  border:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.timer-box{
  flex:1;min-height:300px;background:rgba(0,0,0,.24);
  border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;padding:24px;overflow:hidden;
  transition:background .18s,border-color .18s,box-shadow .18s;
  touch-action:none;
}
.timer-box.hold{border-color:rgba(245,158,11,.65);background:rgba(245,158,11,.10)}
.timer-box.ready{border-color:rgba(34,197,94,.8);background:rgba(34,197,94,.17);box-shadow:0 0 0 3px rgba(34,197,94,.14)}
.timer-box.running{border-color:rgba(99,102,241,.65);background:rgba(0,0,0,.12)}
.timer-display{
  font-family:'JetBrains Mono',monospace;font-size:clamp(3.4rem,9vw,7rem);
  font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;
  text-shadow:0 6px 24px rgba(0,0,0,.55);transition:color .15s;line-height:1.05;
  word-break:break-all;text-align:center;
}
.timer-box.ready .timer-display{color:#86efac}
.timer-box.hold .timer-display{color:#fde68a}
.timer-hint{
  font-size:.82rem;color:var(--muted);font-weight:700;margin-top:10px;
  letter-spacing:.3px;text-align:center;
}
.history-list{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto;padding-right:4px}
.history-list::-webkit-scrollbar{width:4px}
.history-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}
.history-item{
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:12px;padding:8px 9px;display:flex;align-items:center;gap:8px;
  font-size:.86rem;transition:background .15s;
}
.history-item:hover{background:rgba(255,255,255,.08)}
.hi-left{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.hi-idx{font-size:.68rem;color:var(--muted);font-weight:800;width:24px;flex:none;text-align:right}
.hi-time{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:.98rem}
.hi-time.dnf{color:#fca5a5}
.hi-pen{font-size:.68rem;font-weight:800;padding:2px 6px;border-radius:6px;flex:none}
.hi-pen.plus2{background:rgba(245,158,11,.22);color:#fde68a}
.hi-actions{display:flex;gap:1px;flex:none}
.btn-mini{
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:5px 6px;border-radius:7px;font-size:.7rem;font-weight:800;font-family:inherit;
  transition:background .15s,color .15s;
}
.btn-mini:hover{background:rgba(255,255,255,.14);color:#fff}
.btn-mini.del:hover{background:rgba(239,68,68,.25);color:#fecaca}
.empty-note{font-size:.8rem;color:var(--muted);text-align:center;padding:18px 6px;line-height:1.5}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(5,7,18,.72);z-index:100;
  display:grid;place-items:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{
  background:#131735;border:1px solid var(--border);border-radius:24px;
  width:100%;max-width:520px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.6);
  max-height:90vh;overflow-y:auto;
}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:1.15rem;font-weight:800}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);
  background:rgba(20,24,52,.96);border:1px solid var(--border);color:#fff;
  padding:11px 18px;border-radius:14px;font-size:.85rem;font-weight:700;
  box-shadow:0 12px 34px rgba(0,0,0,.5);z-index:300;
  opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;max-width:90vw;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Rekor Baru Banner/Notifikasi Spesial */
.record-badge{
  background:linear-gradient(135deg,rgba(245,158,11,.25),rgba(239,68,68,.25));
  border:1px solid rgba(245,158,11,.6);border-radius:12px;padding:8px 12px;
  font-size:.78rem;font-weight:800;color:#fde68a;display:inline-flex;align-items:center;gap:6px;
  animation:pulseRec 1.5s infinite alternate;margin-bottom:8px;
}
@keyframes pulseRec{
  0%{transform:scale(1);box-shadow:0 0 0 rgba(245,158,11,0)}
  100%{transform:scale(1.02);box-shadow:0 0 16px rgba(245,158,11,.4)}
}

/* ===== Mode Perbesar ===== */
body.is-fullscreen header,
body.is-fullscreen .sidebar-left,
body.is-fullscreen .sidebar-right,
body.is-fullscreen .scramble-box,
body.is-fullscreen .timer-top-bar{display:none !important}
body.is-fullscreen{overflow:hidden}
body.is-fullscreen::before{filter:blur(calc(var(--blur) * .28));inset:-20px}
body.is-fullscreen::after{opacity:calc(var(--overlay) * .45)}
body.is-fullscreen .main-container{padding:0;max-width:none;height:100dvh;gap:0}
body.is-fullscreen .center-stage{height:100dvh;padding:0}
body.is-fullscreen .timer-box{
  border:none;border-radius:0;background:transparent;
  flex:1;height:100%;width:100%;padding:16px;
}
body.is-fullscreen .timer-display{font-size:clamp(4rem,17vw,13rem);letter-spacing:-4px}
body.is-fullscreen .timer-hint{font-size:.9rem;opacity:.8}
.unfs-btn{
  position:fixed;top:18px;right:18px;z-index:250;display:none;
  background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.32);color:#fff;
  padding:10px 16px;border-radius:14px;font-weight:800;font-size:.85rem;
  font-family:inherit;cursor:pointer;backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(0,0,0,.5);align-items:center;gap:8px;
}
body.is-fullscreen .unfs-btn{display:inline-flex}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg width="18" height="18" fill="none" stroke="white" stroke-width="2.4" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
    </div>
    <span>AetherCube</span>
  </div>
  <div class="nav-controls">
    <button class="btn btn-icon" id="btn-fs" title="Perbesar Timer">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      <span>Perbesar</span>
    </button>
    <button class="btn btn-icon" id="btn-settings" title="Pengaturan">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Pengaturan</span>
    </button>
  </div>
</header>

<button class="unfs-btn" id="btn-unfs">
  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
  Perkecil
</button>

<main class="main-container">
  <aside class="sidebar-left">
    <div class="glass-panel panel-section">
      <div class="section-title">Statistik Sesi</div>
      <div class="stats-grid">
        <div class="stat-card"><span class="stat-lbl">Tercepat</span><span class="stat-val" id="stat-best">-</span></div>
        <div class="stat-card"><span class="stat-lbl">Ao5</span><span class="stat-val" id="stat-ao5">-</span></div>
        <div class="stat-card"><span class="stat-lbl">Ao12</span><span class="stat-val" id="stat-ao12">-</span></div>
        <div class="stat-card"><span class="stat-lbl">Ao50</span><span class="stat-val" id="stat-ao50">-</span></div>
        <div class="stat-card" style="grid-column:1/-1"><span class="stat-lbl">Mean (rata-rata)</span><span class="stat-val" id="stat-mean">-</span></div>
      </div>
    </div>
    <div class="glass-panel panel-section" style="flex:1;display:flex;flex-direction:column">
      <div class="section-title">Grafik Progres</div>
      <div style="flex:1;min-height:150px;display:grid;place-items:center">
        <canvas id="prog-canvas" style="width:100%;height:140px;display:block"></canvas>
      </div>
    </div>
  </aside>

  <section class="center-stage">
    <div class="scramble-box glass-panel">
      <div id="record-banner-slot"></div>
      <div class="scramble-text" id="scramble-disp">Memuat scramble…</div>
      <div class="scramble-actions">
        <button class="btn" id="btn-new-scramble" style="padding:6px 12px;font-size:.78rem">Acak Baru</button>
        <button class="btn" id="btn-toggle-net" style="padding:6px 12px;font-size:.78rem">Jaring Warna</button>
      </div>
      <div class="net-wrap" id="net-wrap"><div class="net" id="net-grid"></div></div>
    </div>

    <div class="timer-top-bar">
      <div class="session-badge" id="session-lbl">Sesi Utama · 3x3x3</div>
      <div style="display:flex;gap:6px">
        <button class="btn" id="btn-plus2" style="padding:6px 10px;font-size:.75rem">+2</button>
        <button class="btn btn-danger" id="btn-dnf" style="padding:6px 10px;font-size:.75rem">DNF</button>
      </div>
    </div>

    <div class="timer-box glass-panel" id="timer-box" role="button" tabindex="0" aria-label="Timer utama">
      <div class="timer-display" id="timer-display">0.00</div>
      <div class="timer-hint" id="timer-hint">Tekan spasi atau sentuh layar untuk mulai</div>
    </div>
  </section>

  <aside class="sidebar-right">
    <div class="glass-panel panel-section" style="display:flex;flex-direction:column;flex:1">
      <div class="section-title">
        <span>Riwayat Solve</span>
        <button class="btn btn-danger" id="btn-clear-session" style="padding:3px 7px;font-size:.65rem">Reset</button>
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-note">Belum ada solve tersimpan dalam sesi ini.</div>
      </div>
    </div>
  </aside>
</main>

<div class="modal-backdrop" id="settings-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Pengaturan &amp; Sesi</div>
      <button class="btn btn-icon" id="modal-close" style="padding:6px 10px">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">Kategori / Event</label>
      <select id="event-select">
        <option value="333">3x3x3 Cube</option>
        <option value="222">2x2x2 Cube</option>
        <option value="444">4x4x4 Cube</option>
        <option value="pyram">Pyraminx</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Foto Latar Belakang (Wallpaper)</label>
      <input type="file" id="bg-file-input" accept="image/*">
      <div class="row-btns" style="margin-top:8px">
        <button class="btn btn-danger" id="btn-remove-bg" style="padding:6px 10px;font-size:.75rem">Hapus Wallpaper</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Kegelapan Latar: <b id="val-overlay">38%</b></label>
      <input type="range" id="overlay-range" min="0" max="90" step="1" value="38">
    </div>

    <div class="form-group">
      <label class="form-label">Blur Latar: <b id="val-blur">16px</b></label>
      <input type="range" id="blur-range" min="0" max="30" step="1" value="16">
    </div>

    <div class="form-group">
      <label class="form-label">Inspeksi WCA (15 detik)</label>
      <select id="inspect-select">
        <option value="on">Aktif (standar WCA)</option>
        <option value="off">Nonaktif</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Efek Suara</label>
      <select id="sound-select">
        <option value="on">Aktif</option>
        <option value="off">Nonaktif</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Getar (Haptik)</label>
      <select id="haptic-select">
        <option value="on">Aktif</option>
        <option value="off">Nonaktif</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Nama Sesi</label>
      <input type="text" id="session-input" maxlength="28" placeholder="Sesi Utama">
    </div>

    <div class="row-btns" style="margin-top:18px">
      <button class="btn" id="btn-export" style="padding:8px 12px;font-size:.78rem">Ekspor Data</button>
      <button class="btn btn-danger" id="btn-wipe" style="padding:8px 12px;font-size:.78rem">Hapus Semua Data</button>
    </div>
  </div>
</div>

<div class="toast" id="toast-msg">Pesan</div>

<script>
(function(){
'use strict';

var HOLD_MS = 300;
var KEY = 'aethercube.v5';
var $ = function(id){ return document.getElementById(id); };

var DEFAULTS = {
  event:'333', inspection:'on', overlay:38, blur:16, bgImg:'',
  sound:'on', haptics:'on', sessionName:'Sesi Utama', history:[]
};

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return clone(DEFAULTS);
    var parsed = JSON.parse(raw);
    var out = clone(DEFAULTS);
    for(var k in parsed){ if(Object.prototype.hasOwnProperty.call(parsed,k)) out[k] = parsed[k]; }
    if(!Array.isArray(out.history)) out.history = [];
    return out;
  }catch(e){ return clone(DEFAULTS); }
}

var S = load();

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Penyimpanan penuh — wallpaper tidak disimpan'); }
}

var toastTimer = 0;
function toast(msg){
  var t = $('toast-msg');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ---------- Audio & Haptik ---------- */
var actx = null;
function beep(freq, dur){
  if(S.sound !== 'on') return;
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    if(!actx) actx = new Ctx();
    if(actx.state === 'suspended') actx.resume();
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    var t0 = actx.currentTime;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }catch(e){}
}
function buzz(ms){
  if(S.haptics !== 'on') return;
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

/* ---------- Format ---------- */
function fmt(ms, penalty){
  if(penalty === 'DNF') return 'DNF';
  var v = ms + (penalty === '+2' ? 2000 : 0);
  if(!isFinite(v) || v < 0) v = 0;
  var cs = Math.floor(v / 10) % 100;
  var totalS = Math.floor(v / 1000);
  var s = totalS % 60;
  var m = Math.floor(totalS / 60);
  var p2 = function(n){ return n < 10 ? '0' + n : '' + n; };
  return m > 0 ? m + ':' + p2(s) + '.' + p2(cs) : s + '.' + p2(cs);
}

/* ---------- Scramble Generator ---------- */
var FACE = ['U','D','L','R','F','B'];
var AXIS = { U:0, D:0, L:1, R:1, F:2, B:2 };
var SUF = ['', "'", '2'];

function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function genScramble(event){
  var len, faces, wide = false;
  if(event === '222'){ len = 11; faces = ['U','R','F']; }
  else if(event === '444'){ len = 40; faces = FACE.slice(); wide = true; }
  else if(event === 'pyram'){ len = 12; faces = ['U','L','R','B']; }
  else { len = 20; faces = FACE.slice(); }

  var res = [];
  var lastAxis = -1;
  for(var i = 0; i < len; i++){
    var f;
    do { f = pick(faces); } while(AXIS[f.replace('w','')] === lastAxis);
    lastAxis = AXIS[f.replace('w','')];
    var suf = pick(SUF);
    if(wide && Math.random() < 0.28 && (f === 'U' || f === 'D' || f === 'L' || f === 'R' || f === 'F' || f === 'B')) {
      f = f + 'w';
    }
    res.push(f + suf);
  }
  return res.join(' ');
}

var currentScramble = '';
function newScramble(){
  currentScramble = genScramble(S.event);
  $('scramble-disp').textContent = currentScramble;
  renderNet();
}

/* ---------- Net Warna Sederhana ---------- */
function renderNet(){
  var wrap = $('net-grid');
  wrap.innerHTML = '';
  if(S.event !== '333' && S.event !== '222'){
    $('net-wrap').classList.remove('show');
    return;
  }
  var size = S.event === '222' ? 2 : 3;
  var colors = { U:'#fff', D:'#ffeb3b', L:'#ff9800', R:'#f44336', F:'#4caf50', B:'#2196f3', blank:'transparent' };
  var faceList = ['blank','U','blank','blank', 'L','F','R','B', 'blank','D','blank','blank'];
  
  faceList.forEach(function(f){
    var div = document.createElement('div');
    if(f === 'blank'){
      div.className = 'net-face blank';
    } else {
      div.className = 'net-face';
      div.style.gridTemplateColumns = 'repeat(' + size + ',1fr)';
      div.style.gridTemplateRows = 'repeat(' + size + ',1fr)';
      for(var i = 0; i < size * size; i++){
        var cell = document.createElement('div');
        cell.className = 'net-cell';
        cell.style.background = colors[f];
        div.appendChild(cell);
      }
    }
    wrap.appendChild(div);
  });
}

/* ---------- State Machine Timer ---------- */
var state = 'idle'; // idle | inspect | hold | ready | running
var tStart = 0;
var tElapsed = 0;
var rAF = null;
var holdTimer = null;
var inspectTimer = null;
var inspectSec = 15;

var box = $('timer-box');
var disp = $('timer-display');
var hint = $('timer-hint');

function setTimerState(st){
  state = st;
  box.className = 'timer-box glass-panel ' + st;
}

function updateDisplay(txt){
  disp.textContent = txt;
}

function startInspection(){
  if(S.inspection !== 'on'){
    setTimerState('ready');
    updateDisplay('0.00');
    hint.textContent = 'Lepas untuk mulai';
    beep(880, 0.08);
    return;
  }
  setTimerState('inspect');
  inspectSec = 15;
  updateDisplay('15');
  hint.textContent = 'Masa inspeksi (15s)';
  beep(440, 0.05);

  var startTs = Date.now();
  clearInterval(inspectTimer);
  inspectTimer = setInterval(function(){
    var elapsed = Math.floor((Date.now() - startTs) / 1000);
    var left = 15 - elapsed;
    if(left > 0){
      inspectSec = left;
      updateDisplay(left);
      if(left <= 3) beep(600, 0.04);
    } else if(left === 0){
      inspectSec = 0;
      updateDisplay('+2');
      hint.textContent = 'Penalti +2 detik';
      beep(300, 0.15);
    } else if(left === -2){
      inspectSec = -2;
      updateDisplay('DNF');
      hint.textContent = 'Penalti DNF';
      beep(200, 0.25);
      clearInterval(inspectTimer);
    }
  }, 1000);
}

function startSolve(){
  clearInterval(inspectTimer);
  setTimerState('running');
  hint.textContent = 'Solve berjalan... Klik untuk berhenti';
  tStart = performance.now();
  buzz(35);
  beep(750, 0.07);

  function frame(){
    var now = performance.now();
    tElapsed = now - tStart;
    updateDisplay(fmt(tElapsed, 'normal'));
    if(state === 'running'){
      rAF = requestAnimationFrame(frame);
    }
  }
  rAF = requestAnimationFrame(frame);
}

function stopSolve(){
  cancelAnimationFrame(rAF);
  setTimerState('idle');
  hint.textContent = 'Tekan spasi atau sentuh layar untuk mulai';
  beep(520, 0.09);
  buzz(25);

  var penalty = 'normal';
  if(state === 'inspect' || inspectSec === 0) penalty = '+2';
  if(inspectSec <= -2) penalty = 'DNF';

  addSolve(Math.floor(tElapsed), penalty);
  newScramble();
}

/* ---------- Statistik & Analisis Rekor ---------- */
function calcStats(){
  var hist = S.history;
  var valList = hist.map(function(item){
    if(item.penalty === 'DNF') return Infinity;
    return item.time + (item.penalty === '+2' ? 2000 : 0);
  });

  var validVals = valList.filter(function(v){ return isFinite(v); });
  var best = validVals.length ? Math.min.apply(null, validVals) : Infinity;

  $('stat-best').textContent = isFinite(best) ? fmt(best, 'normal') : '-';
  $('stat-ao5').textContent = calcAo(validVals, 5);
  $('stat-ao12').textContent = calcAo(validVals, 12);
  $('stat-ao50').textContent = calcAo(validVals, 50);

  if(validVals.length){
    var sum = validVals.reduce(function(a,b){ return a+b; }, 0);
    $('stat-mean').textContent = fmt(sum / validVals.length, 'normal');
  } else {
    $('stat-mean').textContent = '-';
  }

  renderHistory();
  renderChart();
  return best;
}

function calcAo(vals, n){
  if(vals.length < n) return '-';
  var slice = vals.slice(0, n);
  slice.sort(function(a,b){ return a - b; });
  slice.pop(); slice.shift(); // buang max & min
  var sum = slice.reduce(function(a,b){ return a+b; }, 0);
  return fmt(Math.round(sum / (n - 2)), 'normal');
}

/* ---------- Notifikasi Rekor Baru ---------- */
function checkNewRecord(newSolveVal){
  var bannerSlot = $('record-banner-slot');
  bannerSlot.innerHTML = '';
  
  var validHistory = S.history.filter(function(h){ return h.penalty !== 'DNF'; });
  if(validHistory.length <= 1) return; // Belum ada rekor sebelumnya

  var prevBests = validHistory.slice(1).map(function(h){
    return h.time + (h.penalty === '+2' ? 2000 : 0);
  });
  var oldBest = Math.min.apply(null, prevBests);

  if(newSolveVal < oldBest){
    buzz([50, 50, 100]);
    beep(980, 0.12);
    setTimeout(function(){ beep(1320, 0.2); }, 140);

    var badge = document.createElement('div');
    badge.className = 'record-badge';
    badge.innerHTML = '<svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> Rekor Sesi Baru Tercapai! (' + fmt(newSolveVal, 'normal') + ')';
    bannerSlot.appendChild(badge);
    toast('Selamat! Rekor baru tercapai!');
  }
}

/* ---------- Riwayat Solve ---------- */
function addSolve(ms, penalty){
  S.history.unshift({ time: ms, penalty: penalty, date: Date.now() });
  save();
  var currentVal = ms + (penalty === '+2' ? 2000 : (penalty === 'DNF' ? 0 : 0));
  if(penalty !== 'DNF') checkNewRecord(currentVal);
  calcStats();
}

function renderHistory(){
  var list = $('history-list');
  list.innerHTML = '';
  if(!S.history.length){
    list.innerHTML = '<div class="empty-note">Belum ada solve tersimpan dalam sesi ini.</div>';
    return;
  }
  S.history.forEach(function(item, idx){
    var div = document.createElement('div');
    div.className = 'history-item';
    var formatted = fmt(item.time, item.penalty);
    var penHtml = '';
    if(item.penalty === '+2') penHtml = '<span class="hi-pen plus2">+2</span>';
    else if(item.penalty === 'DNF') penHtml = '<span class="hi-pen plus2" style="background:rgba(239,68,68,.25);color:#fca5a5">DNF</span>';

    div.innerHTML = '<div class="hi-left">' +
      '<span class="hi-idx">' + (S.history.length - idx) + '</span>' +
      '<span class="hi-time ' + (item.penalty === 'DNF' ? 'dnf' : '') + '">' + formatted + '</span>' +
      penHtml +
    '</div>' +
    '<div class="hi-actions">' +
      '<button class="btn-mini" data-act="p2" data-idx="' + idx + '">+2</button>' +
      '<button class="btn-mini" data-act="dnf" data-idx="' + idx + '">DNF</button>' +
      '<button class="btn-mini del" data-act="del" data-idx="' + idx + '">✕</button>' +
    '</div>';
    list.appendChild(div);
  });
}

$('history-list').addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if(!btn) return;
  var idx = parseInt(btn.getAttribute('data-idx'), 10);
  var act = btn.getAttribute('data-act');
  if(isNaN(idx)) return;

  if(act === 'del'){
    S.history.splice(idx, 1);
  } else if(act === 'p2'){
    S.history[idx].penalty = S.history[idx].penalty === '+2' ? 'normal' : '+2';
  } else if(act === 'dnf'){
    S.history[idx].penalty = S.history[idx].penalty === 'DNF' ? 'normal' : 'DNF';
  }
  save();
  calcStats();
});

/* ---------- Grafik Progres Canvas ---------- */
function renderChart(){
  var canvas = $('prog-canvas');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  var w = rect.width;
  var h = rect.height;
  ctx.clearRect(0, 0, w, h);

  var valid = S.history.slice(0, 25).reverse().map(function(item){
    if(item.penalty === 'DNF') return null;
    return item.time + (item.penalty === '+2' ? 2000 : 0);
  }).filter(function(v){ return v !== null; });

  if(valid.length < 2) return;

  var min = Math.min.apply(null, valid);
  var max = Math.max.apply(null, valid);
  var range = max - min || 1;

  ctx.beginPath();
  ctx.strokeStyle = '#818cf8';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';

  valid.forEach(function(v, i){
    var x = (i / (valid.length - 1)) * (w - 16) + 8;
    var y = h - 12 - ((v - min) / range) * (h - 24);
    if(i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

/* ---------- Event Listeners Timer & Kontrol ---------- */
box.addEventListener('pointerdown', function(e){
  if(e.button && e.button !== 0) return;
  if(state === 'running'){
    stopSolve();
    e.preventDefault();
    return;
  }
  if(state === 'idle' || state === 'inspect'){
    clearInterval(inspectTimer);
    setTimerState('hold');
    updateDisplay('0.00');
    hint.textContent = 'Tahan sampai warna hijau...';
    
    clearTimeout(holdTimer);
    holdTimer = setTimeout(function(){
      if(state === 'hold'){
        setTimerState('ready');
        hint.textContent = 'Lepas untuk mulai!';
        beep(700, 0.05);
        buzz(30);
      }
    }, HOLD_MS);
  }
});

box.addEventListener('pointerup', function(e){
  clearTimeout(holdTimer);
  if(state === 'hold'){
    setTimerState('idle');
    hint.textContent = 'Tahan lebih lama!';
    updateDisplay('0.00');
  } else if(state === 'ready'){
    startSolve();
  }
});

window.addEventListener('keydown', function(e){
  if(e.code === 'Space' && !e.repeat){
    if(document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') return;
    e.preventDefault();
    if(state === 'running'){
      stopSolve();
    } else if(state === 'idle' || state === 'inspect'){
      clearInterval(inspectTimer);
      setTimerState('hold');
      updateDisplay('0.00');
      hint.textContent = 'Tahan sampai hijau...';
      
      clearTimeout(holdTimer);
      holdTimer = setTimeout(function(){
        if(state === 'hold'){
          setTimerState('ready');
          hint.textContent = 'Lepas spasi untuk mulai!';
          beep(700, 0.05);
          buzz(30);
        }
      }, HOLD_MS);
    }
  }
});

window.addEventListener('keyup', function(e){
  if(e.code === 'Space'){
    clearTimeout(holdTimer);
    if(state === 'hold'){
      setTimerState('idle');
      hint.textContent = 'Tahan lebih lama!';
      updateDisplay('0.00');
    } else if(state === 'ready'){
      startSolve();
    }
  }
});

/* ---------- Tombol & UI Lainnya ---------- */
$('btn-new-scramble').addEventListener('click', function(){ newScramble(); });
$('btn-toggle-net').addEventListener('click', function(){
  $('net-wrap').classList.toggle('show');
});

$('btn-plus2').addEventListener('click', function(){
  if(S.history.length){
    S.history[0].penalty = S.history[0].penalty === '+2' ? 'normal' : '+2';
    save(); calcStats();
  }
});
$('btn-dnf').addEventListener('click', function(){
  if(S.history.length){
    S.history[0].penalty = S.history[0].penalty === 'DNF' ? 'normal' : 'DNF';
    save(); calcStats();
  }
});

$('btn-clear-session').addEventListener('click', function(){
  if(confirm('Hapus semua riwayat pada sesi ini?')){
    S.history = [];
    save(); calcStats();
    toast('Sesi direset');
  }
});

/* Fullscreen toggle */
function toggleFS(){
  document.body.classList.toggle('is-fullscreen');
}
$('btn-fs').addEventListener('click', toggleFS);
$('btn-unfs').addEventListener('click', toggleFS);

/* Modal Pengaturan */
var modal = $('settings-modal');
$('btn-settings').addEventListener('click', function(){ modal.classList.add('open'); });
$('modal-close').addEventListener('click', function(){ modal.classList.remove('open'); });
modal.addEventListener('click', function(e){ if(e.target === modal) modal.classList.remove('open'); });

/* Form bindings */
$('event-select').value = S.event;
$('inspect-select').value = S.inspection;
$('sound-select').value = S.sound;
$('haptic-select').value = S.haptics;
$('session-input').value = S.sessionName;
$('session-lbl').textContent = S.sessionName + ' · ' + $('event-select').selectedOptions[0].text;
$('overlay-range').value = S.overlay;
$('blur-range').value = S.blur;
$('val-overlay').textContent = S.overlay + '%';
$('val-blur').textContent = S.blur + 'px';

if(S.bgImg){
  document.documentElement.style.setProperty('--bgimg', 'url(' + S.bgImg + ')');
}
document.documentElement.style.setProperty('--overlay', S.overlay / 100);
document.documentElement.style.setProperty('--blur', S.blur + 'px');

$('event-select').addEventListener('change', function(e){
  S.event = e.target.value;
  save();
  $('session-lbl').textContent = S.sessionName + ' · ' + e.target.selectedOptions[0].text;
  newScramble();
});
$('inspect-select').addEventListener('change', function(e){ S.inspection = e.target.value; save(); });
$('sound-select').addEventListener('change', function(e){ S.sound = e.target.value; save(); });
$('haptic-select').addEventListener('change', function(e){ S.haptics = e.target.value; save(); });
$('session-input').addEventListener('input', function(e){
  S.sessionName = e.target.value || 'Sesi';
  save();
  $('session-lbl').textContent = S.sessionName + ' · ' + $('event-select').selectedOptions[0].text;
});

$('overlay-range').addEventListener('input', function(e){
  S.overlay = parseInt(e.target.value, 10);
  $('val-overlay').textContent = S.overlay + '%';
  document.documentElement.style.setProperty('--overlay', S.overlay / 100);
  save();
});
$('blur-range').addEventListener('input', function(e){
  S.blur = parseInt(e.target.value, 10);
  $('val-blur').textContent = S.blur + 'px';
  document.documentElement.style.setProperty('--blur', S.blur + 'px');
  save();
});

$('bg-file-input').addEventListener('change', function(e){
  var f = e.target.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(evt){
    S.bgImg = evt.target.result;
    document.documentElement.style.setProperty('--bgimg', 'url(' + S.bgImg + ')');
    save();
    toast('Wallpaper berhasil dipasang');
  };
  reader.readAsDataURL(f);
});

$('btn-remove-bg').addEventListener('click', function(){
  S.bgImg = '';
  document.documentElement.style.setProperty('--bgimg', 'none');
  save();
  toast('Wallpaper dihapus');
});

$('btn-export').addEventListener('click', function(){
  var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S, null, 2));
  var dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", "aethercube_backup.json");
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
  toast('Data diekspor');
});

$('btn-wipe').addEventListener('click', function(){
  if(confirm('Hapus seluruh data & pengaturan secara permanen?')){
    localStorage.removeItem(KEY);
    location.reload();
  }
});

/* Init Pertama */
newScramble();
calcStats();

})();
</script>
</body>
</html>
